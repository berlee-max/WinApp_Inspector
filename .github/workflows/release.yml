name: Release

# Builds the win-x64 packages and attaches them to a GitHub Release.
# Triggered by pushing a tag such as v0.1.0, or by hand with a version (a pre-release is created then).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.0-preview.1). A pre-release is created."
        required: true
        type: string

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  publish:
    name: Publish win-x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'push') { '${{ github.ref_name }}'.TrimStart('v') } else { '${{ inputs.version }}' }
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Not a semantic version: $version" }
          $numeric = ($version -split '-')[0]
          "version=$version" >> $env:GITHUB_OUTPUT
          "numeric=$numeric" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ('${{ github.event_name }}' -eq 'push' -and $version -notmatch '-') { 'false' } else { 'true' })" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore WinAppInspector.sln

      - name: Test
        run: dotnet test WinAppInspector.sln --configuration Release

      # Portable: a self-contained folder (exe + dlls). Nothing to install and nothing to extract at start-up.
      # WPF cannot be trimmed, so the folder carries the whole .NET 8 + WPF runtime (~170 MB on disk); a compressed
      # single-file exe would be the same bytes plus a slow first start, so it is deliberately not built.
      - name: Publish portable (self-contained folder)
        run: >
          dotnet publish src/WinAppInspector.UI/WinAppInspector.UI.csproj
          --configuration Release --runtime win-x64 --self-contained true
          -p:PublishSingleFile=false -p:PublishReadyToRun=true -p:DebugType=none
          -p:Version=${{ steps.version.outputs.version }} -p:AssemblyVersion=${{ steps.version.outputs.numeric }} -p:FileVersion=${{ steps.version.outputs.numeric }}
          --output publish/portable

      # Lite: one small exe that needs the .NET 8 Desktop Runtime installed (the apphost offers the download when it is missing).
      - name: Publish lite (framework-dependent single file)
        run: >
          dotnet publish src/WinAppInspector.UI/WinAppInspector.UI.csproj
          --configuration Release --runtime win-x64 --self-contained false
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=false -p:DebugType=none
          -p:Version=${{ steps.version.outputs.version }} -p:AssemblyVersion=${{ steps.version.outputs.numeric }} -p:FileVersion=${{ steps.version.outputs.numeric }}
          --output publish/lite

      - name: Package
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item README.md publish/portable/
          Copy-Item README.md publish/lite/
          # The portable zip unpacks into a folder of its own so the dlls do not spill into Downloads.
          New-Item -ItemType Directory -Force -Path "stage/WinAppInspector-$v" | Out-Null
          Copy-Item publish/portable/* "stage/WinAppInspector-$v" -Recurse
          Compress-Archive -Path "stage/WinAppInspector-$v" -DestinationPath "dist/WinAppInspector-$v-win-x64-portable.zip"
          Compress-Archive -Path publish/lite/* -DestinationPath "dist/WinAppInspector-$v-win-x64-lite.zip"
          "portable folder on disk: {0:N0} MB" -f ((Get-ChildItem publish/portable -Recurse | Measure-Object Length -Sum).Sum / 1MB)
          Get-ChildItem dist | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }
          Get-FileHash dist/*.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WinAppInspector-${{ steps.version.outputs.version }}-win-x64
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: WinApp Inspector ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          body: |
            ## 下载

            | 文件 | 说明 |
            |---|---|
            | `WinAppInspector-${{ steps.version.outputs.version }}-win-x64-portable.zip` | **便携版**。解压得到一个文件夹，运行里面的 `WinAppInspector.exe`；不需要安装 .NET，启动不解压。因为 WPF 无法裁剪，文件夹带完整运行时，解压后约 170 MB。 |
            | `WinAppInspector-${{ steps.version.outputs.version }}-win-x64-lite.zip` | **精简版**，单个 exe 约 7 MB。需要已安装 [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0)（没装时 exe 会提示下载）。 |
            | `SHA256SUMS.txt` | 校验和。 |

            要求 Windows 10 1809 及以上，64 位。程序未签名，首次运行 SmartScreen 可能提示"未知发布者"，选择"仍要运行"。
            程序不需要管理员权限；只有删除 HKLM 项、服务、计划任务时才会按需提权。
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
