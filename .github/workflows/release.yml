name: Release

# Builds the win-x64 packages and attaches them to a GitHub Release.
# Triggered by pushing a tag such as v0.1.1, or by hand with a version.
# Every release is a pre-release (test build) unless it is run by hand with `stable` ticked:
# the project stays in test versions (v0.1.1, v0.2.0, ...) until the owner declares a build release-quality.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.1 or 0.2.0)."
        required: true
        type: string
      stable:
        description: "Publish as a formal release instead of a pre-release. Only when the owner has declared the build release-quality."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  publish:
    name: Publish win-x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'push') { '${{ github.ref_name }}'.TrimStart('v') } else { '${{ inputs.version }}' }
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Not a semantic version: $version" }
          $numeric = ($version -split '-')[0]
          "version=$version" >> $env:GITHUB_OUTPUT
          "numeric=$numeric" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ('${{ inputs.stable }}' -eq 'true' -and $version -notmatch '-') { 'false' } else { 'true' })" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore WinAppInspector.sln

      - name: Test
        run: dotnet test WinAppInspector.sln --configuration Release

      # The app itself: one framework-dependent exe (ReadyToRun so start-up does not JIT everything). It is the
      # lite package as-is and sits under app\ in the portable package.
      - name: Publish app (framework-dependent single file)
        run: >
          dotnet publish src/WinAppInspector.UI/WinAppInspector.UI.csproj
          --configuration Release --runtime win-x64 --self-contained false
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=false -p:PublishReadyToRun=true -p:DebugType=none
          -p:Version=${{ steps.version.outputs.version }} -p:AssemblyVersion=${{ steps.version.outputs.numeric }} -p:FileVersion=${{ steps.version.outputs.numeric }}
          --output publish/app

      # The portable launcher: a NativeAOT exe that needs no .NET, starts app\WinAppInspector.exe and points it at runtime\.
      - name: Publish launcher (NativeAOT)
        run: >
          dotnet publish src/WinAppInspector.Launcher/WinAppInspector.Launcher.csproj
          --configuration Release --runtime win-x64 -p:PublishAot=true
          -p:Version=${{ steps.version.outputs.version }} -p:AssemblyVersion=${{ steps.version.outputs.numeric }} -p:FileVersion=${{ steps.version.outputs.numeric }}
          --output publish/launcher

      # WPF cannot be trimmed, so the portable package carries the official .NET 8 runtime in its own folder instead of
      # ~230 loose files next to the exe. The "windowsdesktop" archive holds only Microsoft.WindowsDesktop.App; the base
      # runtime (Microsoft.NETCore.App + host\fxr) comes from the "dotnet" archive, so both go into the same folder.
      - name: Download .NET 8 runtime for the portable package
        shell: pwsh
        run: |
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile dotnet-install.ps1
          ./dotnet-install.ps1 -Runtime dotnet -Channel 8.0 -Architecture x64 -InstallDir publish/runtime -NoPath
          ./dotnet-install.ps1 -Runtime windowsdesktop -Channel 8.0 -Architecture x64 -InstallDir publish/runtime -NoPath
          Remove-Item publish/runtime/dotnet.exe -ErrorAction SilentlyContinue
          foreach ($required in 'host/fxr', 'shared/Microsoft.NETCore.App', 'shared/Microsoft.WindowsDesktop.App') {
            if (-not (Test-Path "publish/runtime/$required")) { throw "runtime folder is incomplete: $required is missing" }
            "$required`: $((Get-ChildItem "publish/runtime/$required").Name -join ', ')"
          }

      - name: Package
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          # Portable: WinAppInspector.exe (launcher) + README + app\ + runtime\, inside a folder of its own.
          $root = "stage/WinAppInspector-$v"
          New-Item -ItemType Directory -Force -Path "$root/app", "$root/runtime" | Out-Null
          Copy-Item publish/launcher/WinAppInspector.exe $root/
          Copy-Item README.md $root/
          Copy-Item publish/app/WinAppInspector.exe "$root/app/"
          Copy-Item publish/runtime/* "$root/runtime" -Recurse
          Compress-Archive -Path $root -DestinationPath "dist/WinAppInspector-$v-win-x64-portable.zip"

          # Lite: the same app exe on its own; needs the .NET 8 Desktop Runtime installed.
          New-Item -ItemType Directory -Force -Path stage/lite | Out-Null
          Copy-Item publish/app/WinAppInspector.exe stage/lite/
          Copy-Item README.md stage/lite/
          Compress-Archive -Path stage/lite/* -DestinationPath "dist/WinAppInspector-$v-win-x64-lite.zip"

          "portable folder on disk: {0:N0} MB" -f ((Get-ChildItem $root -Recurse | Measure-Object Length -Sum).Sum / 1MB)
          Get-ChildItem dist | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }
          Get-FileHash dist/*.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      # Both packages must actually start on Windows before anything is published.
      - name: Start the portable package (self-test through the launcher)
        shell: pwsh
        run: ./tools/smoke-launch.ps1 -Path "stage/WinAppInspector-${{ steps.version.outputs.version }}/WinAppInspector.exe"

      - name: Start the lite package (self-test)
        shell: pwsh
        run: ./tools/smoke-launch.ps1 -Path stage/lite/WinAppInspector.exe

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WinAppInspector-${{ steps.version.outputs.version }}-win-x64
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: WinApp Inspector ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          body: |
            ## 下载

            | 文件 | 说明 |
            |---|---|
            | `WinAppInspector-${{ steps.version.outputs.version }}-win-x64-portable.zip` | **便携版**。解压得到一个文件夹，运行里面的 `WinAppInspector.exe`；不需要安装 .NET。根目录只有启动器和 `app\`、`runtime\` 两个子目录，运行时带完整的 .NET 8 桌面运行时（WPF 无法裁剪），解压后约 150 MB。 |
            | `WinAppInspector-${{ steps.version.outputs.version }}-win-x64-lite.zip` | **精简版**，单个 exe 约 8 MB。需要已安装 [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0)（没装时 exe 会提示下载）。 |
            | `SHA256SUMS.txt` | 校验和。 |

            要求 Windows 10 1809 及以上，64 位。程序未签名，首次运行 SmartScreen 可能提示"未知发布者"，选择"仍要运行"。
            程序不需要管理员权限；只有删除 HKLM 项、服务、计划任务时才会按需提权。
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
